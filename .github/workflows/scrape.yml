name: Scrape Kids Cinema Showings

on:
  schedule:
    - cron: '0 20 * * 3'   # Wednesday at 20:00 UTC (evening, after listings go live)
    - cron: '1 0 * * 4'    # Thursday at 00:01 UTC (backup run)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FORCE_SCRAPE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage EVERYTHING your scraper changed (index.html, data/showings.json, etc.)
          git add -A

          # If nothing changed, exit cleanly
          if git diff --staged --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "chore: update cinema showings $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
