name: Scrape Kids Cinema Showings

on:
  schedule:
    # Run every Tuesday at 8am UTC (so data is ready by the weekend)
    - cron: '0 8 * * 2'
  workflow_dispatch:  # Also allows manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/showings.json
          git diff --staged --quiet || git commit -m "chore: update cinema showings $(date +'%Y-%m-%d')"
          git push
