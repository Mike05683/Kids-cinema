name: Scrape Kids Cinema Showings

on:
  schedule:
    - cron: '1 0 * * 3'
    - cron: '1 0 * * 4'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FORCE_SCRAPE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scraper.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/showings.json
          git stash || true
          git pull --rebase
          git stash pop || true
          git diff --staged --quiet || git commit -m "chore: update cinema showings $(date +'%Y-%m-%d')"
          git push || true
