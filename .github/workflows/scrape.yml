name: Scrape Kids Cinema Showings

on:
  schedule:
    - cron: '0 6 * * *'    # Every day at 06:00 UTC
    - cron: '0 13 * * *'   # Every day at 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FORCE_SCRAPE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scraper.py

      - name: Commit data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Capture the freshly-scraped JSON
          DATA=$(cat data/showings.json)

          # Switch to main so GitHub Pages picks up the update
          git fetch origin main
          git checkout main

          # Write the new data and commit only that file
          echo "$DATA" > data/showings.json
          git add data/showings.json

          if git diff --staged --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "chore: update cinema showings $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
